# Single-process Mimir for development. Do not use in production.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

distributor:
  ring:
    kvstore:
      store: inmemory
  pool:
    health_check_ingesters: true

ingester:
  ring:
    min_ready_duration: 0s
    final_sleep: 0s
    num_tokens: 512
    kvstore:
      store: inmemory
    replication_factor: 1

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory

# Ruler не стартует: ruler_storage не задан (IsDefaults) → Mimir пропускает ruler в monolithic.
# Для алертов добавьте ruler_storage (local/S3) и при необходимости volume для /data/ruler.

limits:
  ingestion_rate: 250000
  ingestion_burst_size: 500000
