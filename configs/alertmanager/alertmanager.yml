# Minimal Alertmanager config. Add receivers (Slack, email, webhook) and routes as needed.
# Docs: https://prometheus.io/docs/alerting/latest/configuration/

global:
  # resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Placeholder: no action. Add Slack/email/webhook here, e.g.:
    # slack_configs:
    #   - send_resolved: true
    #     api_url: 'https://hooks.slack.com/...'
    #     channel: '#alerts'
